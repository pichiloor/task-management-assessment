# Pending: seed, worker and nginx.
# PostgreSQL and Redis are internal only: no host ports are published.
name: task-management

x-database-env: &database-env
  POSTGRES_USER: ${POSTGRES_USER:?Run scripts/setup-env.sh first}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-env.sh first}
  POSTGRES_DB: ${POSTGRES_DB:?Run scripts/setup-env.sh first}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"

services:
  db:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/setup-env.sh first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-env.sh first}
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/setup-env.sh first}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies Alembic migrations, then exits.
  migrate:
    build:
      context: ./backend
      target: runtime
    environment: *database-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      <<: *database-env
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup-env.sh first}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REDIS_URL: redis://redis:6379/0
    command:
      ["uvicorn", "--factory", "app.api.app:create_app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Runs the backend suite against a separate *_test database:
  #   docker compose run --rm --build backend-tests
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      <<: *database-env
      TEST_POSTGRES_DB: ${POSTGRES_DB}_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
