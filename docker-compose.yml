# Only nginx (the web service) publishes a host port; PostgreSQL, Redis and
# the API are reachable only inside the compose networks.
name: task-management

x-database-env: &database-env
  POSTGRES_USER: ${POSTGRES_USER:?Run scripts/setup-env.sh first}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-env.sh first}
  POSTGRES_DB: ${POSTGRES_DB:?Run scripts/setup-env.sh first}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"

# Settings shared by the API (publishes jobs, serves files) and the worker.
x-export-env: &export-env
  # Its own Redis database, so queue keys never mix with rate-limit counters.
  CELERY_BROKER_URL: redis://redis:6379/1
  EXPORT_DIR: /data/exports
  EXPORT_TTL_HOURS: ${EXPORT_TTL_HOURS:-24}

services:
  db:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/setup-env.sh first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-env.sh first}
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/setup-env.sh first}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    # Append-only file: queued export jobs survive a Redis restart. Jobs lost
    # anyway are republished by the beat service (PostgreSQL is the source
    # of truth).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies Alembic migrations and loads the demo data (idempotent),
  # then exits. The api waits for it to finish successfully.
  migrate:
    build:
      context: ./backend
      target: runtime
    environment:
      <<: *database-env
      SEED_DEMO_DATA: "true"
    command: ["sh", "-c", "alembic upgrade head && python -m app.infrastructure.seed"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      <<: [*database-env, *export-env]
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup-env.sh first}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-5/minute}
      RATE_LIMIT_API: ${RATE_LIMIT_API:-120/minute}
      RATE_LIMIT_EXPORTS: ${RATE_LIMIT_EXPORTS:-5/minute}
      RATE_LIMIT_KEY_PREFIX: ${RATE_LIMIT_KEY_PREFIX:-task-management}
      # Only nginx (fixed address on the edge network) may set X-Forwarded-For.
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-172.31.240.10}
    command:
      # X-Forwarded-For is handled inside the app (RATE_LIMIT_TRUSTED_PROXIES),
      # so uvicorn's own proxy-header handling is turned off.
      - uvicorn
      - --factory
      - app.api.app:create_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-proxy-headers
    volumes:
      - exports:/data/exports
    networks:
      - default
      - edge
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The only service with a host port: serves the React build and proxies
  # /api to the API. Open http://localhost:8080 (WEB_PORT to change it).
  web:
    build:
      context: ./frontend
      target: runtime
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks:
      edge:
        ipv4_address: 172.31.240.10
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  # Celery worker for CSV exports. Reads jobs from Redis, tasks from
  # PostgreSQL, and writes files to the volume the API serves them from.
  worker:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      <<: [*database-env, *export-env]
    command:
      - celery
      - --app=app.infrastructure.worker_main
      - worker
      - --loglevel=INFO
      - --concurrency=2
      # Maintenance first, so it is picked up before queued exports.
      - --queues=maintenance,celery
    volumes:
      - exports:/data/exports
    healthcheck:
      test:
        - CMD-SHELL
        - celery --app=app.infrastructure.worker_main inspect ping --destination "celery@$$HOSTNAME" --timeout 5
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Schedules the export maintenance task every minute (republishes exports
  # whose job was lost, gives up on stale ones, deletes expired files). The
  # task itself runs on the worker. Exactly one beat must run.
  beat:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      <<: [*database-env, *export-env]
    command:
      - celery
      - --app=app.infrastructure.worker_main
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Runs the backend suite against a separate *_test database:
  #   docker compose run --rm --build backend-tests
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      <<: *database-env
      TEST_POSTGRES_DB: ${POSTGRES_DB}_test
      # Database 15 is reserved for tests; rate-limit tests remove their keys
      # and worker tests use unique queue names.
      TEST_REDIS_URL: redis://redis:6379/15
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  default:
  # nginx and the API only; fixed range so the API can trust nginx's address.
  edge:
    ipam:
      config:
        - subnet: 172.31.240.0/28

volumes:
  db-data:
  redis-data:
  exports:
