server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Task bodies are small; nothing larger needs to reach the API.
    client_max_body_size 64k;

    # No URI after the upstream: the /api prefix is passed through unchanged.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replaced, not appended: a client cannot forge its address for the
        # rate limiter, which trusts this header only from nginx.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite puts a content hash in these file names.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes (/login, ...) all load index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
